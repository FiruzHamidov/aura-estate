# Install in /etc/nginx/snippets/ and include inside the existing /storage/
# location of backend.aura.tj, replacing its old three CORS add_header lines.
# Keep that location's security headers, try_files and private-path restrictions.
add_header Access-Control-Allow-Origin $aura_public_media_cors_origin always;
add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
add_header Access-Control-Allow-Headers "*" always;
add_header Vary Origin always;
