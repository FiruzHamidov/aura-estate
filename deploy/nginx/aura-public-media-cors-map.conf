# Install as /etc/nginx/conf.d/aura-public-media-cors-map.conf (http context).
# Public file downloads are allowed from both production website origins only.
map $http_origin $aura_public_media_cors_origin {
    default "";
    "https://aura.tj"     "https://aura.tj";
    "https://www.aura.tj" "https://www.aura.tj";
}
