[program:aura-estate-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/aura-estate/artisan queue:work database --sleep=3 --tries=1 --timeout=120
directory=/var/www/aura-estate
user=root
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/aura-estate/storage/logs/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
